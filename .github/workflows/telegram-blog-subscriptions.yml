name: Manage Telegram Blog Subscriptions

on:
  schedule:
    # Runs once daily at 15:30 UTC (~8:30 AM PDT / 7:30 AM PST).
    # New /subscribe messages wait in Telegram's queue until this runs.
    - cron: '30 15 * * *'
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  manage-subscriptions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install js-yaml
        run: npm install js-yaml

      - name: Process subscription requests
        env:
          TELEGRAM_BLOG_BOT_TOKEN: ${{ secrets.TELEGRAM_BLOG_BOT_TOKEN }}
        run: |
          cat > process-subscriptions.cjs << 'SCRIPT'
          const https = require('https');
          const fs = require('fs');
          const yaml = require('js-yaml');

          const botToken = process.env.TELEGRAM_BLOG_BOT_TOKEN;
          const subscribersFile = '_data/telegram_blog_subscribers.json';
          const siteUrl = 'https://berens.co';

          // Load existing subscribers or create empty list
          let subscribers = { users: [] };
          if (fs.existsSync(subscribersFile)) {
            subscribers = JSON.parse(fs.readFileSync(subscribersFile, 'utf8'));
          }

          function escapeHtml(str) {
            return String(str)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');
          }

          const slugify = (t) => String(t).toLowerCase().trim()
            .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

          // Load all published posts (front matter only), newest first
          function loadPosts() {
            const files = fs.readdirSync('_posts')
              .filter(f => f.endsWith('.md')).sort().reverse();
            const cutoff = new Date();
            cutoff.setUTCHours(23, 59, 59, 999);
            const posts = [];
            for (const f of files) {
              const raw = fs.readFileSync('_posts/' + f, 'utf8');
              const m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---/);
              if (!m) continue;
              let fm;
              try { fm = yaml.load(m[1]); } catch (e) { continue; }
              if (fm.date && new Date(fm.date) > cutoff) continue; // not yet published
              const slug = fm.slug || f.replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/\.md$/, '');
              posts.push({
                path: '_posts/' + f,
                slug: slug,
                title: fm.title || slug,
                description: fm.description || '',
                tags: Array.isArray(fm.tags) ? fm.tags : []
              });
            }
            return posts;
          }

          const posts = loadPosts();
          const latest = posts[0];

          // Hand-curated "reader favorite" from _data/featured_post.yml
          let featured = null;
          if (fs.existsSync('_data/featured_post.yml')) {
            try {
              const cfg = yaml.load(fs.readFileSync('_data/featured_post.yml', 'utf8'));
              if (cfg && cfg.post) {
                featured = posts.find(p => p.path === cfg.post || p.slug === cfg.post);
              }
            } catch (e) { console.error('Could not read featured_post.yml:', e.message); }
          }

          // "Title", linked (title only, for brevity)
          function postLink(p) {
            return `"<a href="${siteUrl}/${p.slug}.html">${escapeHtml(p.title)}</a>"`;
          }

          // Tags that actually have a page under posts/tags/, ranked by post count
          function rankedTags() {
            const available = new Set(
              fs.readdirSync('posts/tags').filter(f => f.endsWith('.md')).map(f => f.replace(/\.md$/, ''))
            );
            const counts = {};
            posts.forEach(p => p.tags.forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
            return Object.entries(counts)
              .filter(([t]) => available.has(slugify(t)))
              .sort((a, b) => b[1] - a[1])
              .map(([t, n]) => ({ tag: t, count: n }));
          }

          const tagLink = (t) => `<a href="${siteUrl}/posts/tag/${slugify(t.tag)}/">${escapeHtml(t.tag)}</a> (${t.count})`;

          function welcomeDigest() {
            const lines = ['📚 Some reading to get you started:', ''];
            if (latest) lines.push(`🆕 Latest: ${postLink(latest)}`);
            if (featured && (!latest || featured.slug !== latest.slug)) {
              lines.push(`⭐ Reader favorite: ${postLink(featured)}`);
            }
            const tags = rankedTags().slice(0, 3);
            if (tags.length) {
              lines.push(`🏷️ Browse by topic: ${tags.map(tagLink).join(', ')}`);
            }
            return lines.join('\n');
          }

          // Function to make HTTPS requests
          function makeRequest(options) {
            return new Promise((resolve, reject) => {
              https.get(options, (res) => {
                let data = '';
                res.on('data', (chunk) => { data += chunk; });
                res.on('end', () => {
                  try {
                    resolve(JSON.parse(data));
                  } catch (e) {
                    reject(new Error('Failed to parse response: ' + data));
                  }
                });
              }).on('error', reject);
            });
          }

          // Function to send message
          function sendMessage(chatId, text, disablePreview) {
            return new Promise((resolve, reject) => {
              const postData = JSON.stringify({
                chat_id: chatId,
                text: text,
                parse_mode: 'HTML',
                disable_web_page_preview: !!disablePreview
              });

              const options = {
                hostname: 'api.telegram.org',
                path: `/bot${botToken}/sendMessage`,
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(postData)
                }
              };

              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', (chunk) => { data += chunk; });
                res.on('end', () => {
                  try {
                    const response = JSON.parse(data);
                    if (response.ok) {
                      resolve(response);
                    } else {
                      console.error('Telegram API error:', response);
                      resolve(response); // Don't reject to avoid stopping workflow
                    }
                  } catch (e) {
                    console.error('Failed to parse Telegram response:', data);
                    resolve(); // Don't reject
                  }
                });
              });

              req.on('error', (error) => {
                console.error('Request error:', error);
                resolve(); // Don't reject
              });

              req.write(postData);
              req.end();
            });
          }

          // Get updates from Telegram
          async function processUpdates() {
            const options = {
              hostname: 'api.telegram.org',
              path: `/bot${botToken}/getUpdates`
            };

            const response = await makeRequest(options);

            if (!response.ok || !response.result.length) {
              console.log('No new messages');
              return false;
            }

            let hasChanges = false;
            let lastUpdateId = 0;

            for (const update of response.result) {
              lastUpdateId = Math.max(lastUpdateId, update.update_id);

              if (!update.message || !update.message.text) continue;

              const chatId = update.message.chat.id;
              const text = update.message.text.toLowerCase().trim();
              const username = update.message.from.username || update.message.from.first_name;

              if (text === '/subscribe' || text === '/start') {
                // Check if already subscribed
                const existingUser = subscribers.users.find(u => u.chat_id === chatId);

                if (existingUser) {
                  await sendMessage(chatId, '✅ You\'re already subscribed to new posts, Silly!');
                } else {
                  subscribers.users.push({
                    chat_id: chatId,
                    username: username,
                    subscribed_at: new Date().toISOString()
                  });
                  hasChanges = true;
                  await sendMessage(chatId, '🙌 <b>Subscribed!</b> You\'ll get a message here whenever a new post is published on berens.co.\n\n/unsubscribe - Stop receiving posts');
                  await sendMessage(chatId, welcomeDigest(), true);
                  console.log(`New subscriber: ${username} (${chatId})`);
                }
              } else if (text === '/unsubscribe') {
                const index = subscribers.users.findIndex(u => u.chat_id === chatId);

                if (index !== -1) {
                  subscribers.users.splice(index, 1);
                  hasChanges = true;
                  await sendMessage(chatId, '👋 <b>Unsubscribed</b>. Send /subscribe anytime to rejoin!');
                  console.log(`Unsubscribed: ${username} (${chatId})`);
                } else {
                  await sendMessage(chatId, 'You\'re not currently subscribed. Send /subscribe to start receiving new posts from berens.co!');
                }
              } else if (text === '/help') {
                await sendMessage(chatId, '🛟 <b>Help</b>\n\nCommands:\n/subscribe - Get new berens.co posts as they\'re published\n/unsubscribe - Stop receiving posts\n/help - Show this message');
              }
            }

            // Mark messages as read
            if (lastUpdateId > 0) {
              const offsetOptions = {
                hostname: 'api.telegram.org',
                path: `/bot${botToken}/getUpdates?offset=${lastUpdateId + 1}`
              };
              await makeRequest(offsetOptions);
            }

            return hasChanges;
          }

          // Main execution
          (async () => {
            try {
              const hasChanges = await processUpdates();

              if (hasChanges) {
                // Save updated subscribers
                fs.writeFileSync(subscribersFile, JSON.stringify(subscribers, null, 2));
                console.log(`Subscribers updated. Total: ${subscribers.users.length}`);
              } else {
                console.log('No subscription changes');
              }
            } catch (error) {
              console.error('Error:', error.message);
              process.exit(1);
            }
          })();
          SCRIPT

          node process-subscriptions.cjs

      - name: Commit subscriber changes
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _data/telegram_blog_subscribers.json
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            git commit -m "Update Telegram blog subscribers"
            git pull --rebase origin master
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify on subscriber changes
        if: steps.commit.outputs.changed == 'true'
        env:
          TELEGRAM_BLOG_BOT_TOKEN: ${{ secrets.TELEGRAM_BLOG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOTAL=$(cat _data/telegram_blog_subscribers.json | jq '.users | length')

          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BLOG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="📊 Blog subscriber update: ${TOTAL} total subscribers" \
            -d parse_mode="HTML"
